<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>导航基线 · 逐步回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101720;color:#e5edf6;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1450px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:17px;margin:0 0 10px}.muted{color:#9cacc0;font-size:13px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tasks{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.task,button,select{background:#202d3e;color:#edf4ff;border:1px solid #41526a;border-radius:9px;padding:9px 13px;cursor:pointer}.task{text-align:left}.task.active{border:2px solid #70b7ff}.success{color:#70dbb1}.failed{color:#ffab92}.running{color:#f5d486}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:20px}.panel{background:#192330;border:1px solid #2d3c50;border-radius:12px;padding:18px;margin-bottom:14px}.screen{position:relative;background:#05090e;border-radius:9px;overflow:hidden;aspect-ratio:4/3}.screen img{width:100%;height:100%;object-fit:contain}.overlay{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:linear-gradient(transparent,rgba(0,0,0,.92));white-space:pre-wrap;text-shadow:0 1px 3px #000;pointer-events:none}#action{font-size:22px;font-weight:700}#raw{white-space:pre-wrap;overflow-wrap:anywhere;font-family:ui-monospace,monospace;color:#aeddff}input[type=range]{width:100%;margin:16px 0;accent-color:#70b7ff}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{font-size:24px;font-weight:650}#instruction{margin:10px 0}#reason{font-size:16px}button:disabled{opacity:.45;cursor:default}#network{color:#f5d486}canvas{width:100%;height:110px}a{color:#8cc6ff}@media(max-width:900px){.layout{grid-template-columns:1fr}.tasks{grid-template-columns:repeat(3,1fr)}header{display:block}}
</style>
<main><header><div><h1>导航基线 · 逐步回放</h1><div id="run" class="muted"></div></div><div><div id="overall"></div><div id="network" class="muted">读取评测记录…</div></div></header>
<div class="muted">真实保存画面按动作步播放。这里只展示已记录的模型回答和动作，不生成模型没有输出的推理理由。</div>
<div class="controls" style="margin-top:16px"><label>筛选 <select id="filter"><option value="all">全部任务</option><option value="success">成功</option><option value="failed">失败</option><option value="running">运行中</option><option value="pending">等待</option></select></label><label>任务ID <input id="search" type="search" placeholder="例如 10" style="width:110px;padding:9px;border-radius:8px"></label><button id="pagePrev">上一页</button><span id="pageInfo" class="muted"></span><button id="pageNext">下一页</button><button id="refresh">刷新记录</button></div>
<div class="tasks" id="tasks"></div>
<div class="layout"><section><div class="panel"><div class="screen"><img id="frame" alt="机器人视角"><div class="overlay"><div id="action"></div><div id="overlayText"></div></div></div>
<input id="seek" type="range" min="0" max="0" value="0" aria-label="动作步进度">
<div class="controls"><button id="prev">上一步</button><button id="play">▶ 播放</button><button id="next">下一步</button><select id="speed" aria-label="回放速度"><option value="1000">1步/秒</option><option value="500" selected>2步/秒</option><option value="200">5步/秒</option></select><button id="end">最终画面</button><label><input id="follow" type="checkbox">跟随最新记录</label></div>
<div class="controls" style="margin-top:12px"><span class="muted">关键步骤</span><button id="call">下次模型调用</button><button id="near">首次进入3米</button><button id="collision">首次碰撞</button></div>
<div class="muted" id="stepNote"></div></div>
<div class="panel"><h2>任务指令</h2><div id="instruction"></div><div class="muted">这条自然语言指令和当前/历史画面是模型的导航输入。</div></div>
</section><aside><div class="panel"><h2>任务结果</h2><div id="reason"></div><div class="metrics"><div><div class="muted">最终 SR / SPL</div><div class="value" id="scores">—</div></div><div><div class="muted">已记录动作数</div><div class="value" id="count">0</div></div></div></div>
<div class="panel"><h2>当前动作来自哪里</h2><div id="source"></div><p class="muted">对应的模型原始回答</p><div id="raw"></div><div id="error" class="failed"></div></div>
<div class="panel"><h2>执行后的反馈</h2><div id="feedback"></div><canvas id="chart" width="600" height="140"></canvas><div class="muted">距离曲线；虚线为3米。距离与碰撞是评测反馈，不是模型预测的理由。进入3米还必须主动STOP才成功。</div></div>
</aside></div></main>
<script>
const $=id=>document.getElementById(id), names={MOVE_FORWARD:'前进 25cm',TURN_LEFT:'左转 15°',TURN_RIGHT:'右转 15°',STOP:'停止'}, status={pending:'等待',running:'运行中',success:'成功',failed:'失败'};
let data=null,eid=null,index=0,playing=false,showFinal=false,timer=null,busy=false,page=0;
function renderTasks(){let list=data.episodes.filter(e=>($('filter').value==='all'||e.status===$('filter').value)&&e.id.includes($('search').value.trim()));let pages=Math.max(1,Math.ceil(list.length/12));page=Math.min(page,pages-1);$('pageInfo').textContent=`${list.length}条 · ${page+1}/${pages}页`;$('pagePrev').disabled=page===0;$('pageNext').disabled=page===pages-1;$('tasks').replaceChildren(...list.slice(page*12,page*12+12).map(t=>{let b=document.createElement('button');b.className='task '+(t.id===eid?'active':'');let label=document.createElement('div');label.textContent='任务 '+t.id;let state=document.createElement('div');state.className=t.status;state.textContent=status[t.status]+' · '+t.rows.length+'步';b.append(label,state);b.onclick=()=>select(t.id);return b}));if(!list.length)$('tasks').textContent='没有符合筛选条件的任务；下方保留当前回放。'}
function jump(i){if(i<0)return;pause();$('follow').checked=false;index=i;showFinal=false;render()}
function episode(){return data?.episodes.find(e=>e.id===eid)}
function pause(){playing=false;clearTimeout(timer);$('play').textContent='▶ 播放'}
function tick(){if(!playing)return;let e=episode();if(index<e.rows.length-1){index++;showFinal=false;render();timer=setTimeout(tick,+$('speed').value)}else{if(e.status==='running')timer=setTimeout(tick,1000);else pause()}}
function select(id){pause();eid=id;index=0;showFinal=false;$('follow').checked=false;render()}
function graph(e){const c=$('chart'),x=c.getContext('2d');x.clearRect(0,0,600,140);if(!e.rows.length)return;let max=Math.max(4,...e.rows.map(r=>r.distance));let y=v=>125-v/max*110; x.strokeStyle='#738399';x.setLineDash([6,5]);x.beginPath();x.moveTo(5,y(3));x.lineTo(595,y(3));x.stroke();x.setLineDash([]);x.strokeStyle='#75baff';x.beginPath();e.rows.forEach((r,i)=>{let p=5+i/Math.max(1,e.rows.length-1)*590;i?x.lineTo(p,y(r.distance)):x.moveTo(p,y(r.distance))});x.stroke();x.fillStyle='#f3c86d';x.beginPath();x.arc(5+index/Math.max(1,e.rows.length-1)*590,y(e.rows[index]?.distance??0),4,0,7);x.fill()}
function render(){let e=episode();if(!e)return;index=Math.min(index,Math.max(0,e.rows.length-1));renderTasks();
$('run').textContent=data.run+' · '+data.model;let finished=data.episodes.filter(t=>t.result),wins=finished.filter(t=>t.result.metrics.success===1).length;$('overall').textContent=data.summary?`全部完成 · SR ${(data.summary.sr*100).toFixed(1)}% · SPL ${data.summary.spl.toFixed(3)}`:`已完成 ${finished.length}/${data.episodes.length} · 成功 ${wins} 条`;
$('instruction').textContent=e.instruction||'该任务开始后显示';$('reason').textContent=e.reason;$('reason').className=e.status;$('scores').textContent=e.result?`${e.result.metrics.success?'1':'0'} / ${e.result.metrics.spl.toFixed(3)}`:'待完成';$('count').textContent=e.rows.length;
$('seek').max=Math.max(0,e.rows.length-1);$('seek').value=index;$('end').disabled=!e.final_available;$('play').disabled=!e.rows.length;$('prev').disabled=!e.rows.length||index===0;$('next').disabled=!e.rows.length||index===e.rows.length-1;$('call').disabled=!e.rows.some((r,i)=>i>index&&r.model_called);$('near').disabled=!e.rows.some(r=>r.distance<3);$('collision').disabled=!e.rows.some(r=>r.collision);
let r=e.rows[index];if(!r){$('frame').removeAttribute('src');for(let id of ['action','overlayText','source','raw','feedback','stepNote','error'])$(id).textContent='';graph(e);return}
let url=`/frame?episode=${e.id}&step=${showFinal?'final':r.step}`;if($('frame').getAttribute('src')!==url){$('frame').style.opacity=0;$('frame').onload=()=>{$('frame').style.opacity=1};$('frame').onerror=()=>{$('stepNote').textContent='该步画面读取失败；动作与指标仍来自日志。'};$('frame').src=url;}
$('action').textContent=showFinal?`任务 ${e.id} 结束 · ${status[e.status]}`:`任务 ${e.id} · 第 ${r.step+1} 步 · ${names[r.action]||r.action}`;
$('overlayText').textContent=showFinal?e.reason:`${r.model_called?'模型新决策':'执行上次决策的动作队列'} · 执行后距目标 ${r.distance.toFixed(2)}m${r.collision?' · 本步发生碰撞':''}`;
$('stepNote').textContent=showFinal?'最终画面：最后一个动作执行后。':'当前画面：本步动作执行前；右侧距离和碰撞：本步动作执行后。回放速度不是实际推理速度。';
$('source').textContent=r.model_called?`本步调用模型，耗时 ${(r.request_s||0).toFixed(3)} 秒`:`执行第 ${r.call_step+1} 步模型回答生成的队列，本步未调用模型`;$('raw').textContent=r.raw||'无有效模型回答';$('error').textContent=r.error||'';
let movement=Math.hypot(...r.after.map((v,i)=>v-r.before[i]));$('feedback').textContent=`距目标 ${r.distance.toFixed(2)}m · 实际位移 ${movement.toFixed(3)}m · ${r.collision?'发生碰撞':'无碰撞'}`;graph(e)}
async function refresh(){if(busy)return;busy=true;try{let res=await fetch('/api/run',{cache:'no-store'});if(!res.ok)throw Error(res.status);data=await res.json();if(!eid)eid=data.episodes[0].id;if($('follow').checked){let live=data.episodes.find(e=>e.status==='running');if(live)eid=live.id;index=Math.max(0,episode().rows.length-1);showFinal=false}render();$('network').textContent=(data.summary?'运行已完成 · 手动刷新可重读记录':'每2秒同步日志')+' · '+new Date().toLocaleTimeString()}catch(err){$('network').textContent='读取失败：'+err.message+'，请刷新重试'}finally{busy=false}}
$('play').onclick=()=>{if(playing)pause();else{playing=true;showFinal=false;if(index>=episode().rows.length-1)index=0;$('follow').checked=false;$('play').textContent='❚❚ 暂停';render();timer=setTimeout(tick,+$('speed').value)}};
$('seek').oninput=e=>jump(+e.target.value);$('prev').onclick=()=>jump(Math.max(0,index-1));$('next').onclick=()=>jump(Math.min(episode().rows.length-1,index+1));$('end').onclick=()=>{pause();$('follow').checked=false;index=Math.max(0,episode().rows.length-1);showFinal=true;render()};$('follow').onchange=()=>{pause();refresh()};
$('filter').onchange=$('search').oninput=()=>{page=0;if(data)renderTasks()};$('pagePrev').onclick=()=>{page--;renderTasks()};$('pageNext').onclick=()=>{page++;renderTasks()};$('refresh').onclick=refresh;
$('call').onclick=()=>jump(episode().rows.findIndex((r,i)=>i>index&&r.model_called));$('near').onclick=()=>jump(episode().rows.findIndex(r=>r.distance<3));$('collision').onclick=()=>jump(episode().rows.findIndex(r=>r.collision));
refresh();setInterval(()=>{if(!data?.summary)refresh()},2000);
</script></html>
